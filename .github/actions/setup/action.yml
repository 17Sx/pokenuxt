name: Set up Bun
description: Installs Bun and the dependencies, with the package cache restored.

inputs:
  workspace:
    description: Only install this workspace's dependencies, like pokenuxt-api. Everything when empty.
    default: ''

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2

    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - run: bun install --frozen-lockfile ${{ inputs.workspace && format('--filter {0}', inputs.workspace) || '' }}
      shell: bash
      working-directory: ${{ github.workspace }}
