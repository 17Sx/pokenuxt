name: Deploy

# Every push to main goes to production, once the front, API and database
# workflows pass: db/ is applied to the database, CDK deploys the API (Lambda
# behind API Gateway) and the front's S3 bucket and CloudFront distribution,
# then the front is generated, synced to S3, and CloudFront's cache is
# invalidated.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  # Never stop a deploy halfway; the next one waits.
  cancel-in-progress: false

jobs:
  front-ci:
    uses: ./.github/workflows/ci.yml

  api-ci:
    uses: ./.github/workflows/api.yml

  db-ci:
    uses: ./.github/workflows/db.yml

  migrate:
    name: Migrate the database
    needs: [front-ci, api-ci, db-ci]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          workspace: pokenuxt-api
      # Supabase's session pooler URL: GitHub's runners have no IPv6, which
      # the direct db.<project>.supabase.co host needs.
      - run: bun run --cwd api db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  api:
    name: Deploy the API and the front's infrastructure
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.site }}
    outputs:
      api: ${{ steps.deploy.outputs.api }}
      site: ${{ steps.deploy.outputs.site }}
      bucket: ${{ steps.deploy.outputs.bucket }}
      distribution: ${{ steps.deploy.outputs.distribution }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # The pokenuxt-github-deploy user (infra/lib/ci-user-stack.ts): it can
      # assume the CDK bootstrap roles, which do the deploying, and publish
      # the front.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # PokenuxtWeb (S3, CloudFront) then PokenuxtApi, whose CORS allows the
      # CloudFront origin, plus WEB_URL when it is set.
      - id: deploy
        working-directory: infra
        run: |
          bun run deploy -- --require-approval never --outputs-file cdk.out/outputs.json ${{ vars.WEB_URL && format('-c webOrigin={0}', vars.WEB_URL) || '' }}
          {
            echo "api=$(jq -r '.PokenuxtApi.ApiUrl' cdk.out/outputs.json)"
            echo "site=$(jq -r '.PokenuxtWeb.SiteUrl' cdk.out/outputs.json)"
            echo "bucket=$(jq -r '.PokenuxtWeb.BucketName' cdk.out/outputs.json)"
            echo "distribution=$(jq -r '.PokenuxtWeb.DistributionId' cdk.out/outputs.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Check the API answers, wishlist included
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${{ steps.deploy.outputs.api }}/health"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${{ steps.deploy.outputs.api }}/wishlist"

  web:
    name: Generate and publish the front
    needs: api
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ needs.api.outputs.site }}
    env:
      BUCKET: ${{ needs.api.outputs.bucket }}
      DISTRIBUTION: ${{ needs.api.outputs.distribution }}
      SITE: ${{ needs.api.outputs.site }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # A static site in .output/public, with every /pokemon/<name> page
      # prerendered from the names the API lists (nuxt.config.ts).
      - name: Generate
        run: bun run generate
        env:
          NUXT_PUBLIC_API_BASE: ${{ needs.api.outputs.api }}
          PRERENDER_POKEMON: '1'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # Built assets have a hash in their name: cache them for a year. Pages
      # and payloads change with each deploy: CloudFront keeps them a day,
      # until the invalidation below, and browsers check every time.
      - name: Sync to S3
        run: |
          aws s3 sync .output/public "s3://$BUCKET" --delete --exclude "*" --include "_nuxt/*" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync .output/public "s3://$BUCKET" --delete --exclude "_nuxt/*" --cache-control "public, max-age=0, s-maxage=86400, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"

      - name: Check the site answers and the API lets it in
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --output /dev/null "$SITE/"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --output /dev/null "$SITE/pokemon/pikachu"
          curl --fail --silent --show-error --head --header "Origin: $SITE" "${{ needs.api.outputs.api }}/health" | grep -i "access-control-allow-origin: $SITE"
