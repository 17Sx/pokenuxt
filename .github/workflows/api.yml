name: API

# The Hono API in api/, on its own: only its dependencies are installed, and
# every step runs with Bun.
on:
  pull_request:
    paths:
      - api/**
      - bun.lock
      - .github/workflows/api.yml
      - .github/actions/setup/**
  push:
    branches: [dev]
    paths:
      - api/**
      - bun.lock
      - .github/workflows/api.yml
      - .github/actions/setup/**
  # Deploy runs it before deploying main.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request replaces the run in progress.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: api

jobs:
  format:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          workspace: pokenuxt-api
      - run: bun run format:check

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          workspace: pokenuxt-api
      - run: bun run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          workspace: pokenuxt-api
      - run: bun run typecheck

  test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          workspace: pokenuxt-api
      # Vitest runs on the Bun runtime: see the test script.
      - run: bun run test
